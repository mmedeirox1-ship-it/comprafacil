<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roleta de Brindes · CompraFácil</title>
<style>
  :root{
    --bg:#050507; --green:#7fc41c; --green-dark:#4f8a0e; --lime:#b6e05a;
    --text:#f5f5f7; --muted:#9b9ba3; --red:#e5484d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,'Inter',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;user-select:none;
  }
  input,textarea{user-select:text;-webkit-user-select:text}
  .glow{position:fixed;border-radius:50%;pointer-events:none}
  .g1{width:80vmax;height:80vmax;top:-40vmax;left:-25vmax;background:radial-gradient(circle,rgba(79,138,14,.4) 0%,transparent 65%)}
  .g2{width:70vmax;height:70vmax;bottom:-35vmax;right:-25vmax;background:radial-gradient(circle,rgba(127,196,28,.28) 0%,transparent 62%)}

  .logo{height:min(7.5vh,60px);margin-bottom:1vh;z-index:2}
  .title{font-size:min(3.8vh,32px);font-weight:900;letter-spacing:-.02em;z-index:2;text-align:center}
  .title span{color:var(--green)}

  .stage{position:relative;z-index:2;margin:1.8vh 0}
  canvas#wheel{
    display:block;border-radius:50%;
    box-shadow:0 0 80px rgba(127,196,28,.35), 0 0 0 10px #0d0d10, 0 0 0 14px rgba(127,196,28,.5);
    touch-action:none;
  }
  .pointer{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;
    border-top:34px solid var(--lime);
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.6));z-index:3;
  }
  .hub{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:18%;height:18%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#1c1c20,#0a0a0c);
    border:4px solid var(--green);
    display:flex;align-items:center;justify-content:center;z-index:3;
    box-shadow:0 0 30px rgba(127,196,28,.5);
  }
  .hub img{width:70%;pointer-events:none}

  .controls{z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.4vh;width:min(88vw,480px)}
  #handle{
    width:100%;font-family:inherit;font-size:min(2.8vh,22px);font-weight:600;
    background:#101014;border:2px solid #2c2c33;border-radius:999px;
    color:var(--text);padding:min(2vh,16px) 24px;text-align:center;outline:none;
  }
  #handle:focus{border-color:var(--green)}
  #handle::placeholder{color:#5b5b63}
  button.spin{
    width:100%;font-family:inherit;
    font-size:min(3.2vh,26px);font-weight:900;letter-spacing:.06em;
    color:#04120a;background:linear-gradient(100deg,var(--green-dark),var(--green),var(--lime));
    border:none;border-radius:999px;padding:min(2.2vh,18px);
    box-shadow:0 10px 40px rgba(127,196,28,.45);
    cursor:pointer;transition:transform .15s;
  }
  button.spin:active{transform:scale(.96)}
  button.spin:disabled{opacity:.35}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);
    display:none;align-items:center;justify-content:center;z-index:10;flex-direction:column;
  }
  .overlay.show{display:flex}
  .result-card{
    background:#0d0d11;border:2px solid var(--green);border-radius:32px;
    padding:5vh 7vw;text-align:center;max-width:88vw;
    box-shadow:0 0 100px rgba(127,196,28,.4);
    animation:pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .result-card .emoji{font-size:min(8vh,64px)}
  .result-card h2{font-size:min(2.8vh,22px);color:var(--muted);font-weight:600;margin:1.2vh 0 .4vh}
  .result-card .who{font-size:min(2.6vh,20px);color:var(--lime);font-weight:800}
  .result-card .prize{font-size:min(5.4vh,46px);font-weight:900;color:var(--green);letter-spacing:-.02em;line-height:1.15;margin-top:.6vh}
  .result-card .note{font-size:min(1.9vh,14px);color:var(--muted);margin-top:1.8vh}
  .result-card button{
    margin-top:3vh;font-family:inherit;font-size:min(2.5vh,19px);font-weight:800;
    background:var(--green);color:#04120a;border:none;border-radius:999px;
    padding:1.6vh 8vw;cursor:pointer;
  }

  .gear{
    position:fixed;bottom:10px;left:10px;z-index:5;
    font-size:20px;background:none;border:none;color:var(--muted);opacity:.22;cursor:pointer;padding:8px;
  }

  /* ============ PAINEL ADMIN ============ */
  .admin{
    position:fixed;inset:0;background:#0a0a0d;z-index:20;display:none;flex-direction:column;
    padding:2.5vh 4vw;overflow:hidden;
  }
  .admin.show{display:flex}
  .admin header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5vh}
  .admin h3{font-size:20px}
  .admin .close{font-size:26px;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 12px}
  .tabs{display:flex;gap:8px;margin-bottom:1.5vh}
  .tabs button{
    font-family:inherit;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;
    border:1px solid #2c2c33;background:#101014;color:var(--muted);cursor:pointer;
  }
  .tabs button.on{background:var(--green);color:#04120a;border-color:var(--green)}
  .pane{flex:1;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
  .pane.on{display:block}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{color:var(--muted);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid #232329;position:sticky;top:0;background:#0a0a0d}
  td{padding:9px 6px;border-bottom:1px solid #17171c;vertical-align:middle}
  td input{
    width:64px;font-family:inherit;font-size:15px;text-align:center;
    background:#101014;border:1px solid #2c2c33;border-radius:8px;color:var(--text);padding:7px 4px;
  }
  .pct{color:var(--lime);font-weight:700;white-space:nowrap}
  .out{color:var(--red);font-weight:700;font-size:12px}
  .inf{color:var(--muted)}
  .estornar{
    font-family:inherit;font-size:12px;font-weight:700;color:var(--red);
    background:none;border:1px solid var(--red);border-radius:8px;padding:5px 10px;cursor:pointer;
  }
  .estornado{opacity:.4;text-decoration:line-through}
  .admin .actions{display:flex;gap:10px;margin-top:1.5vh;flex-wrap:wrap}
  .admin .actions button{
    font-family:inherit;font-size:14px;font-weight:700;padding:12px 20px;border-radius:999px;border:none;cursor:pointer;
  }
  .a-save{background:var(--green);color:#04120a}
  .a-exp{background:#26262c;color:var(--text)}
  .a-danger{background:none;border:1px solid var(--red)!important;color:var(--red)}
  .statline{font-size:13px;color:var(--muted);margin:6px 0 10px}
  .statline b{color:var(--lime)}

  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:15}
</style>
</head>

<script>
/* ================== PRÊMIOS DO EVENTO ==================
   stock: número = quantidade física | null = ilimitado (voucher)
   weight: peso da sorte (maior = sai mais). O painel mostra a % real. */
const DEFAULT_PRIZES = [
  { id:'kit',     name:'Kit Limpa Tela',                stock:119, weight:32 },
  { id:'v15',     name:'15% OFF em acessório',          stock:null, weight:24 },
  { id:'v200',    name:'R$ 200 OFF em iPhone',          stock:null, weight:18 },
  { id:'fone',    name:'Fone de ouvido com fio',        stock:7,   weight:6  },
  { id:'fonte',   name:'Fonte USB-C',                   stock:5,   weight:4  },
  { id:'carveic', name:'Carregador veicular',           stock:5,   weight:4  },
  { id:'suporte', name:'Suporte veicular',              stock:4,   weight:3  },
  { id:'v150',    name:'Voucher R$ 150 em compras',     stock:5,   weight:2  },
  { id:'base',    name:'Base de carregamento indução',  stock:2,   weight:1  },
];
const ADMIN_PIN = '2580';
/* ======================================================== */

let prizes = [], log = [];
loadState();

function loadState(){
  try{
    const p = JSON.parse(localStorage.getItem('cf2_prizes')||'null');
    const l = JSON.parse(localStorage.getItem('cf2_log')||'null');
    prizes = Array.isArray(p)&&p.length ? p : JSON.parse(JSON.stringify(DEFAULT_PRIZES));
    log = Array.isArray(l) ? l : [];
  }catch(e){
    prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES)); log = [];
  }
}
function persist(){
  try{
    localStorage.setItem('cf2_prizes', JSON.stringify(prizes));
    localStorage.setItem('cf2_log', JSON.stringify(log));
  }catch(e){}
}

const avail = () => prizes.filter(p => p.stock === null || p.stock > 0);

/* ---------- RODA ---------- */
const COLORS = ['#7fc41c','#1a1a1f','#4f8a0e','#26262c','#b6e05a','#101014','#5da313','#1f1f24','#3f720c'];
const TEXT_ON = ['#04120a','#b6e05a','#ffffff','#b6e05a','#04120a','#b6e05a','#04120a','#b6e05a','#ffffff'];
const wheel = document.getElementById('wheel');
const wctx = wheel.getContext('2d');
let angle = 0, spinning = false;

function sizeWheel(){
  const s = Math.min(window.innerWidth*.82, window.innerHeight*.46, 560);
  const dpr = window.devicePixelRatio || 1;
  wheel.width = s*dpr; wheel.height = s*dpr;
  wheel.style.width = s+'px'; wheel.style.height = s+'px';
  wctx.setTransform(dpr,0,0,dpr,0,0);
  drawWheel();
}
function drawWheel(){
  const list = avail();
  const s = parseFloat(wheel.style.width), r = s/2, n = Math.max(list.length,1);
  const seg = 2*Math.PI/n;
  wctx.clearRect(0,0,s,s);
  wctx.save(); wctx.translate(r,r); wctx.rotate(angle);
  for(let i=0;i<n;i++){
    wctx.beginPath(); wctx.moveTo(0,0);
    wctx.arc(0,0,r-4, i*seg - Math.PI/2, (i+1)*seg - Math.PI/2);
    wctx.closePath();
    wctx.fillStyle = COLORS[i % COLORS.length]; wctx.fill();
    wctx.strokeStyle = 'rgba(255,255,255,.08)'; wctx.lineWidth = 2; wctx.stroke();
    wctx.save();
    wctx.rotate(i*seg + seg/2 - Math.PI/2);
    wctx.textAlign = 'right';
    wctx.fillStyle = TEXT_ON[i % TEXT_ON.length];
    const fs = Math.max(11, Math.min(19, s/(n*2.1)));
    wctx.font = '800 '+fs+'px -apple-system, Inter, sans-serif';
    const nm = list[i] ? list[i].name : '';
    wctx.fillText(nm.length>24 ? nm.slice(0,23)+'…' : nm, r-20, fs/3);
    wctx.restore();
  }
  wctx.restore();
}

function pickWeighted(){
  const list = avail();
  const total = list.reduce((a,p)=>a+(p.weight||1),0);
  let x = Math.random()*total;
  for(let i=0;i<list.length;i++){
    x -= (list[i].weight||1);
    if(x<=0) return i;
  }
  return list.length-1;
}

/* ---------- SOM ---------- */
let actx;
function beep(f,d,g0){try{
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(g0,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
}catch(e){}}
const tick=()=>beep(900,.05,.05);
function tada(){try{
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  [523,659,784,1047].forEach((f,i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;
    g.gain.setValueAtTime(.12,actx.currentTime+i*.09);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+i*.09+.4);
    o.connect(g);g.connect(actx.destination);
    o.start(actx.currentTime+i*.09);o.stop(actx.currentTime+i*.09+.4);
  });
}catch(e){}}

/* ---------- GIRO ---------- */
function spin(){
  if(spinning) return;
  const raw = document.getElementById('handle').value.trim();
  if(raw.length < 3){
    document.getElementById('handle').focus();
    document.getElementById('handle').placeholder = 'Digite o @ do cliente primeiro!';
    return;
  }
  const handle = raw.startsWith('@') ? raw : '@'+raw;
  const list = avail();
  if(!list.length) return;

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const wIdx = pickWeighted();
  const winner = list[wIdx];
  const n = list.length, seg = 2*Math.PI/n;
  const targetWithin = -(wIdx*seg + seg/2);
  const current = angle % (2*Math.PI);
  const turns = 6 + Math.floor(Math.random()*3);
  const final = angle + turns*2*Math.PI + (targetWithin - current) + (Math.random()-.5)*seg*.5;
  const start = angle, delta = final - start, dur = 5000, t0 = performance.now();
  let lastSector = -1;

  function frame(now){
    const t = Math.min((now-t0)/dur,1);
    const eased = 1 - Math.pow(1-t,4);
    angle = start + delta*eased;
    drawWheel();
    const sector = Math.floor(((-angle % (2*Math.PI))+2*Math.PI)/seg);
    if(sector!==lastSector){ tick(); lastSector=sector; }
    if(t<1) requestAnimationFrame(frame);
    else finishSpin(winner, handle);
  }
  requestAnimationFrame(frame);
}

function finishSpin(winner, handle){
  // baixa de estoque + registro (a parte à prova de erro)
  const p = prizes.find(x=>x.id===winner.id);
  if(p && p.stock !== null) p.stock = Math.max(0, p.stock-1);
  log.push({ t:new Date().toISOString(), handle:handle, prize:winner.name, id:winner.id, st:'ok' });
  persist();
  spinning = false;
  document.getElementById('spinBtn').disabled = false;
  document.getElementById('whoText').textContent = handle;
  document.getElementById('prizeText').textContent = winner.name;
  document.getElementById('overlay').classList.add('show');
  tada(); confettiBurst();
}

function closeResult(){
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();
  document.getElementById('handle').value='';
  document.getElementById('handle').placeholder='@ do Instagram do cliente';
  drawWheel();
}

/* ---------- CONFETTI ---------- */
const cc = document.getElementById('confetti'), cctx = cc.getContext('2d');
let particles=[], confettiOn=false;
function confettiBurst(){
  cc.width=innerWidth; cc.height=innerHeight;
  particles = Array.from({length:140},()=>({
    x:innerWidth/2,y:innerHeight*.35,
    vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
    s:Math.random()*8+4,r:Math.random()*Math.PI,
    c:['#7fc41c','#b6e05a','#ffffff','#4f8a0e'][Math.floor(Math.random()*4)]
  }));
  confettiOn=true;
  (function loop(){
    if(!confettiOn) return;
    cctx.clearRect(0,0,cc.width,cc.height);
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.1;
      cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.r);
      cctx.fillStyle=p.c;cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);cctx.restore();
    });
    particles=particles.filter(p=>p.y<cc.height+40);
    if(particles.length) requestAnimationFrame(loop); else confettiOn=false;
  })();
}
function stopConfetti(){confettiOn=false;cctx.clearRect(0,0,cc.width,cc.height);}

/* ---------- ADMIN ---------- */
function askAdmin(){
  const pin = prompt('PIN da equipe:');
  if(pin === ADMIN_PIN) openAdmin();
}
function openAdmin(){
  renderPrizes(); renderLog();
  document.getElementById('admin').classList.add('show');
}
function closeAdmin(){ document.getElementById('admin').classList.remove('show'); drawWheel(); }
function tab(t){
  ['E','R'].forEach(k=>{
    document.getElementById('tab'+k).classList.toggle('on',k===t);
    document.getElementById('pane'+k).classList.toggle('on',k===t);
  });
}
function renderPrizes(){
  const tb = document.getElementById('prizeRows');
  const activeTotal = avail().reduce((a,p)=>a+(p.weight||1),0);
  tb.innerHTML = prizes.map((p,i)=>{
    const out = p.stock!==null && p.stock<=0;
    const pct = out ? '—' : ((p.weight||1)/activeTotal*100).toFixed(1).replace('.',',')+'%';
    return '<tr>'+
      '<td>'+p.name+(out?' <span class="out">ESGOTADO</span>':'')+'</td>'+
      '<td>'+(p.stock===null?'<span class="inf">∞</span>':'<input type="number" min="0" value="'+p.stock+'" data-i="'+i+'" data-f="stock">')+'</td>'+
      '<td><input type="number" min="0" step="1" value="'+p.weight+'" data-i="'+i+'" data-f="weight"></td>'+
      '<td class="pct">'+pct+'</td>'+
    '</tr>';
  }).join('');
  const fis = prizes.filter(p=>p.stock!==null);
  const rest = fis.reduce((a,p)=>a+p.stock,0);
  document.getElementById('statE').innerHTML =
    'Prêmios físicos restantes: <b>'+rest+'</b> · Giros até agora: <b>'+log.filter(l=>l.st==='ok').length+'</b>';
}
function savePrizes(){
  document.querySelectorAll('#prizeRows input').forEach(inp=>{
    const i = +inp.dataset.i, f = inp.dataset.f, v = Math.max(0, parseInt(inp.value)||0);
    prizes[i][f] = v;
  });
  persist(); renderPrizes(); drawWheel();
}
function renderLog(){
  const tb = document.getElementById('logRows');
  tb.innerHTML = log.slice().reverse().map((l,ri)=>{
    const i = log.length-1-ri;
    const hh = new Date(l.t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const cls = l.st==='estorno' ? ' class="estornado"' : '';
    const btn = l.st==='ok' ? '<button class="estornar" onclick="estornar('+i+')">estornar</button>' : '';
    return '<tr'+cls+'><td>'+hh+'</td><td>'+l.handle+'</td><td>'+l.prize+'</td><td>'+btn+'</td></tr>';
  }).join('');
  document.getElementById('statR').innerHTML =
    'Total de giros válidos: <b>'+log.filter(l=>l.st==='ok').length+'</b>';
}
function estornar(i){
  if(!confirm('Estornar o prêmio "'+log[i].prize+'" de '+log[i].handle+'? O item volta pro estoque.')) return;
  log[i].st='estorno';
  const p = prizes.find(x=>x.id===log[i].id);
  if(p && p.stock!==null) p.stock++;
  persist(); renderLog(); renderPrizes(); drawWheel();
}
function exportCSV(){
  const rows = [['data_hora','instagram','premio','status']]
    .concat(log.map(l=>[l.t,l.handle,l.prize,l.st]));
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download = 'sorteio-roleta-comprafacil.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
function copyLog(){
  const txt = log.map(l=>new Date(l.t).toLocaleString('pt-BR')+' | '+l.handle+' | '+l.prize+' | '+l.st).join('\n');
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove();
  alert('Registro copiado! Cola no WhatsApp ou nas Notas.');
}
function resetAll(){
  if(!confirm('ZERAR TUDO? Estoque volta ao inicial e o registro é apagado. Só faça isso antes do evento!')) return;
  if(!confirm('Tem certeza? Essa ação não pode ser desfeita.')) return;
  prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES)); log = [];
  persist(); renderPrizes(); renderLog(); drawWheel();
}

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('handle').addEventListener('keydown', e=>{ if(e.key==='Enter') spin(); });
window.addEventListener('resize', sizeWheel);
sizeWheel();
</script>
